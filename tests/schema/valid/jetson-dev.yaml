# A typical single-board project: fetched BSP, dev tools, a few local extensions.
cli_requirement: ">=0.41.0"
default_runtime: dev
default_target: jetson-orin-nano-devkit
supported_targets: [qemuarm64, jetson-orin-nano-devkit]

distro:
  release: 2024
  channel: edge

rootfs:
  permissions: prod
  overlay: rootfs
initramfs:
  permissions: prod

runtimes:
  dev-local:
    target_board: qemuarm64
    rootfs: { permissions: dev }
    extensions:
      - avocado-bsp-{{ avocado.target.board }}
      - avocado-ext-sshd-dev
    packages:
      avocado-runtime: '*'
  dev:
    kernel:
      cmdline_extra: "console=ttyTCU0,115200"
    rootfs: { permissions: dev }
    extensions:
      - avocado-bsp-{{ avocado.target.board }}
      - usb-gadget
      - display-tester: { enabled: false }
    packages:
      avocado-runtime: '*'

extensions:
  avocado-bsp-{{ avocado.target.board }}:
    source: { type: package, version: '*' }
  avocado-ext-sshd-dev:
    source: { type: package, version: '*' }
  usb-gadget:
    types: [sysext, confext]
    version: '1.1.0'
    overlay: overlays/usb-gadget
    packages:
      kernel-module-libcomposite-{{ avocado.kernel.version }}: '*'
      kernel-module-usb-f-ncm-{{ avocado.kernel.version }}: '*'
    enable_services: [usb-gadget.service]
    modprobe: [libcomposite]
  display-tester:
    version: '0.1.0'
    overlay: { dir: overlays/display-tester, preprocess: [etc/**/*.conf] }
    packages:
      display-tester: { compile: display-tester, install: display-tester/install.sh }
      libdrm2: '*'
    on_merge:
      - systemctl restart systemd-sysctl.service
    sdk:
      packages:
        nativesdk-uv: '*'
    target-qemuarm64:
      packages:
        mesa: '*'

permissions:
  prod: { users: { root: { password: '*' } } }
  dev: { users: { root: { password: '' } } }

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"
  container_args: [--privileged, --network=host]
  compile:
    display-tester:
      compile: display-tester/compile.sh
      clean: display-tester/clean.sh
      packages: { libdrm-dev: '*' }
  packages:
    avocado-sdk-toolchain: '*'
